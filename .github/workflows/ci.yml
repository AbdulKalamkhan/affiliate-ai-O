name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API tests
        run: npm run -w @ai-os/api test -- --maxWorkers=1

      - name: Web tests
        run: npm run -w @ai-os/web test -- --maxWorkers=1

      - name: API build
        run: npm run -w @ai-os/api build

      - name: Web build
        run: npm run -w @ai-os/web build

      - name: Prisma validate
        run: npx prisma validate --schema packages/database/prisma/schema.prisma
